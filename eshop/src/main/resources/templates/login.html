<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<body>
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4">
                    <h3 class="text-center mb-4 text-primary">🔑 Σύνδεση</h3>

                    <div th:if="${successMessage}" class="alert alert-success text-center">[[${successMessage}]]</div>
                    <div th:if="${loginError}" class="alert alert-danger text-center">[[${loginError}]]</div>

                    <form th:action="@{/login}" th:object="${loginDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Κωδικός</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="******" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Είσοδος</button>
                    </form>

                    <div class="text-center mt-3">
                        <small>Δεν έχετε λογαριασμό; <a th:href="@{/register-page}">Εγγραφείτε εδώ</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
