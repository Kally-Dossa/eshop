<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<body>
<section>
    <div class="container-fluid p-0 mb-5">
        <img th:src="@{/img/eshop-banner.png}" alt="E-Shop Banner" class="img-fluid w-100" style="max-height: 400px; object-fit: cover;">
    </div>

    <div class="container text-center pb-5">
        <h1 class="display-4 fw-bold text-dark mb-3">Καλώς ήρθατε στο E-Shop μας!</h1>
        <p class="lead text-secondary mb-5">Βρείτε τα καλύτερα προϊόντα στις καλύτερες τιμές.</p>

        <div th:if="${session.loggedInUser == null and session.loggedInShop == null}">
            <a th:href="@{/register-page}" class="btn btn-lg btn-primary px-5 me-3">Ξεκινήστε εδώ</a>
            <a th:href="@{/login-page}" class="btn btn-lg btn-outline-secondary px-5">Σύνδεση</a>
        </div>

        <div th:if="${session.loggedInUser != null}" class="alert alert-success d-inline-block px-5">
            Συνεχίστε τις αγορές σας!
        </div>
    </div>
</section>
</body>
</html>
