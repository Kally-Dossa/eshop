<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Διαχείριση Προϊόντων</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">E-Shop Management</span>
        <div class="ms-auto">
            <span class="text-light me-3">Καλωσήρθες, <span th:text="${shopName}"></span></span>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Αποσύνδεση</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-secondary">Τα Προϊόντα μου</h2>
        
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">
            + Νέο Προϊόν
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Τύπος</th>
                    <th>Μάρκα</th>
                    <th>Περιγραφή</th>
                    <th>Τιμή (€)</th>
                    <th>Απόθεμα</th>
                    <th>Ενέργειες</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.type}">Placeholder Type</td>
                    <td th:text="${product.brand}">Placeholder Brand</td>
                    <td th:text="${product.description}">...</td>
                    <td th:text="${product.price}">0.0</td>

                    <td>
                        <form th:action="@{/shop/products/update-stock}" method="post" class="d-flex align-items-center">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <input type="number" name="newStock" th:value="${product.stock}" class="form-control form-control-sm text-center" style="width: 70px;">
                            <button type="submit" class="btn btn-sm btn-outline-success ms-2" title="Ανανέωση Stock">OK</button>
                        </form>
                    </td>

                    <td>
                        <button class="btn btn-sm btn-danger">Διαγραφή</button>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${products == null or products.empty}" class="alert alert-info text-center mt-3">
                Δεν έχετε καταχωρήσει προϊόντα ακόμα ή δεν φορτώθηκαν σωστά.
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalLabel">Καταχώρηση Νέου Προϊόντος</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <form th:action="@{/shop/products/save}" th:object="${newProduct}" method="post">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Τύπος</label>
                            <input type="text" th:field="*{type}" class="form-control" placeholder="π.χ. Laptop" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Μάρκα</label>
                            <input type="text" th:field="*{brand}" class="form-control" placeholder="π.χ. Dell" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Περιγραφή</label>
                        <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Τιμή (€)</label>
                            <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" th:field="*{stock}" class="form-control" required>
                        </div>
                    </div>

                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Ακύρωση</button>
                        <button type="submit" class="btn btn-primary">Αποθήκευση</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
